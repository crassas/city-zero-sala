name: City Zero safe source import

on:
  pull_request:
    branches:
      - main
    types: [edited]

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: import/ai-studio-city-zero-2026-08-22
          fetch-depth: 0

      - name: Detect complete bootstrap
        id: bootstrap
        shell: bash
        run: |
          if [ -f .city-zero-import/READY ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct, extract and verify safe source
        if: steps.bootstrap.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .city-zero-import/source.b64.part-00 \
            .city-zero-import/source.b64.part-01 \
            .city-zero-import/source.b64.part-02 \
            .city-zero-import/source.b64.part-03 \
            .city-zero-import/source.b64.part-04 \
            .city-zero-import/source.b64.part-05 \
            .city-zero-import/source.b64.part-06 \
            .city-zero-import/remainder-* \
            > /tmp/city-zero-source.b64
          base64 --decode /tmp/city-zero-source.b64 > /tmp/city-zero-clean-source.tar.xz
          echo "81a86bd04a8cf2f38ab7fbd580ed3b0f21074f147736996a1d8348e5d543ffbe  /tmp/city-zero-clean-source.tar.xz" | sha256sum -c -
          python - <<'PY'
          import hashlib, json, pathlib, tarfile

          archive = pathlib.Path('/tmp/city-zero-clean-source.tar.xz')
          with tarfile.open(archive, 'r:xz') as tf:
              members = tf.getmembers()
              for member in members:
                  p = pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              tf.extractall('.')

          prohibited = [pathlib.Path('RECEIVED_TOKEN.txt')]
          prohibited += [p for p in pathlib.Path('.').rglob('.env') if p.name == '.env']
          prohibited += list(pathlib.Path('.').glob('DRIVE_CONTENT_*.txt'))
          if any(p.exists() for p in prohibited):
              raise SystemExit('prohibited sensitive/transient file detected')

          expected = json.loads(pathlib.Path('PROTECTED_HASHES.json').read_text())
          for rel, digest in expected.items():
              actual = hashlib.sha256(pathlib.Path(rel).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'protected hash mismatch: {rel}')
          print(f'protected hashes verified: {len(expected)}')
          PY

      - name: Commit verified source to import branch
        if: steps.bootstrap.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, tarfile

          with tarfile.open('/tmp/city-zero-clean-source.tar.xz', 'r:xz') as tf:
              paths = []
              for m in tf.getmembers():
                  if not m.isfile():
                      continue
                  p = m.name[2:] if m.name.startswith('./') else m.name
                  if p:
                      paths.append(p)
          for i in range(0, len(paths), 50):
              subprocess.run(['git', 'add', '--', *paths[i:i+50]], check=True)
          PY
          rm -rf .city-zero-import
          rm -f .github/workflows/city-zero-safe-import.yml
          git add -u -- .city-zero-import .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import City Zero AI Studio source (safe)"
          git push origin HEAD:import/ai-studio-city-zero-2026-08-22
