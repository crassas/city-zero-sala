name: City Zero safe source import

on:
  pull_request:
    branches:
      - main
    types: [edited]

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: import/ai-studio-city-zero-2026-08-22
          fetch-depth: 0

      - name: Detect complete bootstrap
        id: bootstrap
        shell: bash
        run: |
          if [ -f .city-zero-import/READY ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and verify payload
        if: steps.bootstrap.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          root = pathlib.Path('.city-zero-import')
          expected = [root / f'full-{i:03d}' for i in range(111)]
          actual = sorted(root.glob('full-*'))
          if actual != expected:
              missing = [str(p) for p in expected if not p.exists()]
              extra = [str(p) for p in actual if p not in expected]
              raise SystemExit(f'payload chunk set mismatch; missing={missing}; extra={extra}')
          for i, p in enumerate(expected):
              want = 1896 if i == 110 else 4000
              got = p.stat().st_size
              if got != want:
                  raise SystemExit(f'payload chunk size mismatch: {p} got={got} want={want}')
          print('payload chunks verified: 111')
          PY
          cat .city-zero-import/full-* > /tmp/city-zero-source.b64
          echo "742b8e7b7a0534c53f87668c2545511c74eb7e740842c2279ac5173b1733bdb1  /tmp/city-zero-source.b64" | sha256sum -c -
          base64 --decode /tmp/city-zero-source.b64 > /tmp/city-zero-clean-source.tar.xz
          echo "81a86bd04a8cf2f38ab7fbd580ed3b0f21074f147736996a1d8348e5d543ffbe  /tmp/city-zero-clean-source.tar.xz" | sha256sum -c -

      - name: Extract and verify source
        if: steps.bootstrap.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, tarfile

          archive = pathlib.Path('/tmp/city-zero-clean-source.tar.xz')
          with tarfile.open(archive, 'r:xz') as tf:
              members = tf.getmembers()
              for member in members:
                  p = pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f'unsupported archive member type: {member.name}')
              tf.extractall('.', filter='data')

          prohibited = [pathlib.Path('RECEIVED_TOKEN.txt')]
          prohibited += [p for p in pathlib.Path('.').rglob('.env') if p.name == '.env']
          prohibited += list(pathlib.Path('.').glob('DRIVE_CONTENT_*.txt'))
          present = [str(p) for p in prohibited if p.exists()]
          if present:
              raise SystemExit(f'prohibited sensitive/transient file detected: {present}')

          expected = json.loads(pathlib.Path('PROTECTED_HASHES.json').read_text())
          for rel, digest in expected.items():
              path = pathlib.Path(rel)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'protected hash mismatch: {rel}')
          print(f'protected hashes verified: {len(expected)}')
          PY

      - name: Install dependencies
        if: steps.bootstrap.outputs.present == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.bootstrap.outputs.present == 'true'
        run: npm run lint

      - name: Build
        if: steps.bootstrap.outputs.present == 'true'
        run: npm run build

      - name: Commit verified source to import branch
        if: steps.bootstrap.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, tarfile

          with tarfile.open('/tmp/city-zero-clean-source.tar.xz', 'r:xz') as tf:
              paths = []
              for m in tf.getmembers():
                  if not m.isfile():
                      continue
                  p = m.name[2:] if m.name.startswith('./') else m.name
                  if p:
                      paths.append(p)
          for i in range(0, len(paths), 50):
              subprocess.run(['git', 'add', '--', *paths[i:i+50]], check=True)
          PY
          rm -rf .city-zero-import
          rm -f .github/workflows/city-zero-safe-import.yml
          git add -u -- .city-zero-import .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import City Zero AI Studio source (safe verified)"
          git push origin HEAD:import/ai-studio-city-zero-2026-08-22
